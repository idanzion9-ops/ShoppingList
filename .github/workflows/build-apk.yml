name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ShoppingList.apk
          gh release delete apk --yes --cleanup-tag || true
          sleep 3
          gh release create apk ShoppingList.apk \
            --target "${{ github.sha }}" \
            --title "רשימת קניות – אפליקציה" \
            --notes "להורדה והתקנה: ShoppingList.apk. עדכונים לתוכן מגיעים אוטומטית, אין צורך להתקין מחדש." \
            --latest
