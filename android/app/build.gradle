plugins {
    id 'com.android.application'
}

android {
    namespace 'com.idanzion.shoppinglist'
    compileSdk 34

    defaultConfig {
        applicationId 'com.idanzion.shoppinglist'
        minSdk 26
        targetSdk 34
        // להעלות את versionCode רק כשמשנים קוד אנדרואיד (נדיר), ולעדכן גם את nativeVersion ב-docs/version.json
        versionCode 6
        versionName '1.5'
    }

    signingConfigs {
        release {
            // מפתח חתימה קבוע – מאפשר להתקין עדכונים מעל הגרסה הקיימת בלי למחוק
            storeFile file('release.keystore')
            storePassword 'shoppinglist'
            keyAlias 'shoppinglist'
            keyPassword 'shoppinglist'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
